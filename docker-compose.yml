# Docker Compose para desarrollo local de servicios Fargate.
# Los servicios se conectan a los recursos compartidos de AWS del entorno dev.
#
# Uso:
#   docker compose up                    # Levantar todos los servicios
#   docker compose up todo-service    # Levantar solo uno
#   docker compose down                  # Detener todo
#
# Las variables de entorno de conexión a AWS se toman del `.env` de la raíz del repo
# (única fuente de verdad; ver el `env_file: - .env` de abajo).

services:
  todo-service:
    build:
      context: .
      dockerfile: apps/services/todo-service/Dockerfile
      target: builder
    command: pnpm dev
    working_dir: /app/apps/services/todo-service
    volumes:
      - ./apps/services/todo-service/src:/app/apps/services/todo-service/src
      - ./packages:/app/packages
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    environment:
      - NODE_ENV=development
      - PORT=3001
      # Credenciales AWS para acceder a recursos compartidos del entorno dev
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_PROFILE=${AWS_PROFILE:-default}
    env_file:
      - .env
