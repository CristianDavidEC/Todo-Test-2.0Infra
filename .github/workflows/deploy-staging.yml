name: Deploy staging

# Rama `test` → stage `staging`. Auto-deploy en cada push (merge de PR dev → test).
on:
  push:
    branches: [test]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: sst deploy --stage staging
    runs-on: ubuntu-latest
    environment: staging
    # Config que el infra lee de process.env al sintetizar (en local viene del .env).
    env:
      # Compartidas entre stages (variables/secret a nivel repo)
      NEON_ORG_ID: ${{ vars.NEON_ORG_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      # Config por stage (Variables del GitHub Environment) — requireSharedEnv rompe si faltan
      AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
      AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      # Secretos por stage (Secrets del GitHub Environment)
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
      AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: ./.github/actions/setup

      - name: Deploy
        run: pnpm sst deploy --stage staging
